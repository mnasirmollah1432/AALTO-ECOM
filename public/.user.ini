; ---------------------------------------------------------------
; PHP settings for shared hosting (PHP-FPM / CGI, e.g. cPanel).
; Read by PHP before any application code runs, so errors that
; happen during start-up are never printed to visitors either.
; (The app sets display_errors itself at runtime; APP_DEBUG only
; turns it on outside production.) Ignored by `php -S` and mod_php.
; ---------------------------------------------------------------
display_errors = Off
display_startup_errors = Off
log_errors = On
html_errors = Off

; Session hardening (the app sets these too; this covers every script)
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
